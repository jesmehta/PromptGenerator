<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transformation Prompts</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/tracery-grammar@2.7.4/tracery.min.js"></script>
  
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Transformation Prompts</h1>
        <p>Random card generator</p>
      </div>

      <div class="toplinks">
        <a class="link" href="#" id="mainSiteLink">Main site</a>
      </div>
    </header>

<main>
  <section class="card">
    <div class="prompt">
      <p class="promptText" id="promptText">Click “New prompt” to begin.</p>
    </div>

    <div class="controls">
      <button class="primary" id="newBtn">New prompt</button>
      <button id="copyBtn">Copy</button>
    </div>
  </section>

  <section class="card editorCard">
<div class="editorHeader">
  <h2 class="editorTitle">Lists</h2>

  <div class="editorActions">
    <label class="modeToggle">
      <input type="checkbox" id="editableToggle">
      <span>Editable</span>
    </label>

    <button id="applyListsBtn" class="primary">Apply lists</button>
    <button id="resetListsBtn">Reset defaults</button>
  </div>
</div>


    <div class="editorGrid">
      <label class="editorField">
        <span class="editorLabel">Objects (one per line)</span>
        <textarea id="objectsTA" spellcheck="false"></textarea>
      </label>

      <label class="editorField">
        <span class="editorLabel">Audiences (one per line)</span>
        <textarea id="audiencesTA" spellcheck="false"></textarea>
      </label>

      <label class="editorField">
        <span class="editorLabel">Transformations (one per line)</span>
        <textarea id="transformationsTA" spellcheck="false"></textarea>
      </label>
    </div>

    <p class="editorHint" id="editorHint"></p>
  </section>
</main>


    <div class="toast" id="toast">Copied.</div>

    <div class="modalOverlay" id="modalOverlay">
      <div class="modal">
        <h2>PSA</h2>
        <p>You should go do your 20 sketches now.</p>
        <div class="modalActions">
          <button id="modalCloseBtn" class="primary">OK</button>
        </div>
      </div>
    </div>
  
  <footer class="siteFooter">
  © 2026 Jesal Mehta. All rights reserved.
</footer>

</div>

  <script src="app.js"></script>


</body>
</html>
